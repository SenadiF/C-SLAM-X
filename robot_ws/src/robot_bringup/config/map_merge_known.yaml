map_merge:
  ros__parameters:
    use_sim_time: false
    merging_rate: 4.0
    discovery_rate: 0.05
    estimation_rate: 0.5
    estimation_confidence: 0.6
    robot_namespace: "robot"
    robot_map_topic: map
    robot_map_updates_topic: map_updates
    merged_map_topic: map
    robot_map_frame: map
    world_frame: map
    publish_tf: true
    known_init_poses: true

    # Measure robot2's position with a tape measure/ruler relative to
    # robot1's starting position and heading (x = forward from robot1's
    # start, y = left of robot1's start, yaw in radians, 0 = facing the
    # same direction as robot1). Placeholder below assumes robot2 starts
    # 1m to the side of robot1, facing the same way - UPDATE to match
    # wherever you actually place the two robots before launching.
    "/robot1/map_merge/init_pose_x": 0.0
    "/robot1/map_merge/init_pose_y": 0.0
    "/robot1/map_merge/init_pose_z": 0.0
    "/robot1/map_merge/init_pose_yaw": 0.0

    "/robot2/map_merge/init_pose_x": 0.0
    "/robot2/map_merge/init_pose_y": 1.0
    "/robot2/map_merge/init_pose_z": 0.0
    "/robot2/map_merge/init_pose_yaw": 0.0

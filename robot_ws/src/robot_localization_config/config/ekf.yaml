robot1:
  ekf_filter_node:
    ros__parameters:
      frequency: 30.0
      two_d_mode: true
      publish_tf: true

      map_frame: map
      odom_frame: robot1/odom
      base_link_frame: robot1/base_link
      world_frame: robot1/odom

      odom0: /robot1/wheel_odom

      odom0_config: [true, true, false,
                     false, false, true,
                     true, true, false,
                     false, false, true,
                     false, false, false]

      imu0: /robot1/imu

      imu0_config: [false, false, false,
                    false, false, false,
                    false, false, false,
                    true, true, true,
                    true, true, false]

      imu0_remove_gravitational_acceleration: true



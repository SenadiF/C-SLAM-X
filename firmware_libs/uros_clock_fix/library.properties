name=uros_clock_fix
version=1.0.0
author=C-SLAM-X
maintainer=C-SLAM-X
sentence=Fixes micro-ROS timing (uxr_millis/uxr_nanos) on ESP32 Arduino core 3.x.
paragraph=micro_ros_arduino 2.0.8-jazzy is precompiled for a 32-bit time_t and reads tv_nsec at the wrong offset, so its clock only moves in whole seconds. This library linker-wraps uxr_millis and uxr_nanos with esp_timer based versions. See extras/README.md.
category=Other
url=https://github.com/micro-ROS/micro_ros_arduino
architectures=esp32
precompiled=true
ldflags=-Wl,--wrap=uxr_millis -Wl,--wrap=uxr_nanos

robot1:
  ekf_filter_node:
    ros__parameters:
      frequency: 30.0
      two_d_mode: true
      publish_tf: true

      map_frame: map
      odom_frame: robot1/odom
      base_link_frame: robot1/base_link
      world_frame: robot1/odom

      odom0: /robot1/wheel_odom

      # Wheel velocities only (vx, vy, vyaw). Fusing the same encoders'
      # integrated x/y/yaw as well double-counts them.
      odom0_config: [false, false, false,
                     false, false, false,
                     true, true, false,
                     false, false, true,
                     false, false, false]

      imu0: /robot1/imu

      # Yaw from the heading the firmware integrates on the ESP32, fused as
      # the change between consecutive messages (differential): rotation
      # during dropped messages or Wi-Fi outages is still counted, and a
      # firmware reboot (heading back to 0) causes no jump. The gyro *rate*
      # is no longer fused - the EKF only saw the samples that arrived.
      # (BMI160 accelerations are never fused: they ran the filter away to
      # kilometres whenever wheel odometry dropped out.)
      imu0_config: [false, false, false,
                    false, false, true,
                    false, false, false,
                    false, false, false,
                    false, false, false]
      imu0_differential: true

      imu0_remove_gravitational_acceleration: true


